name: oneoff-red-accent
on:
  push:
    branches:
      - redesign/modern-ui-2026-08-23
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/modern-ui-2026-08-23
      - name: Switch modern UI accent to Militaria crimson
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/style.css')
          s = p.read_text()
          replacements = {
            '--accent: #5b6cff;': '--accent: #c8102e;',
            '--accent-dark: #4454e8;': '--accent-dark: #a50d25;',
            '--accent-soft: #eef0ff;': '--accent-soft: #fff0f3;',
            '--accent-2: #7c3aed;': '--accent-2: #e43f5a;',
            '::selection { background: #dfe3ff; color: #222a73; }': '::selection { background: #ffe1e6; color: #731225; }',
            'rgba(91, 108, 255, .14)': 'rgba(200, 16, 46, .13)',
            'rgba(124, 58, 237, .08)': 'rgba(228, 63, 90, .07)',
            'rgba(91,108,255,.30)': 'rgba(200,16,46,.28)',
            'rgba(124,58,237,.12)': 'rgba(228,63,90,.12)',
            '#aeb8ff': '#ffb3c0',
            '#c8ceff': '#ffd0d8',
            'rgba(91,108,255,.12)': 'rgba(200,16,46,.12)',
            'rgba(132,145,255,.16)': 'rgba(228,63,90,.18)',
            '#f2f4ff': '#fff5f7',
            'rgba(91,108,255,.11)': 'rgba(200,16,46,.11)',
            'rgba(117,131,255,.20)': 'rgba(228,63,90,.20)',
            '#8d98ff': '#d85a70',
            'rgba(91,108,255,.10)': 'rgba(200,16,46,.10)',
            'rgba(91,108,255,.20)': 'rgba(200,16,46,.20)',
            'rgba(91,108,255,.24)': 'rgba(200,16,46,.24)',
            '#d7dcff': '#f1c7cf',
            'rgba(91,108,255,.07)': 'rgba(200,16,46,.07)'
          }
          for old,new in replacements.items():
              s = s.replace(old,new)
          p.write_text(s)
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/oneoff-red-accent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/style.css .github/workflows/oneoff-red-accent.yml
          git commit -m "Keep Militaria crimson as modern UI accent"
          git push origin HEAD:redesign/modern-ui-2026-08-23
