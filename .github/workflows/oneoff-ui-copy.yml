name: oneoff-ui-copy
on:
  push:
    branches:
      - redesign/modern-ui-2026-08-23
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/modern-ui-2026-08-23
      - name: Refine visible Polish UI copy
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text()
          replacements = {
            'Nie można połączyć się z serwerem. Czy uruchomiono "node proxy.js"?': 'Nie udało się połączyć z usługą tłumaczenia. Spróbuj ponownie za chwilę.',
            'Słownik branżowy aktywny - terminologia sprzętu będzie fachowa.': 'Terminologia branżowa zostanie uwzględniona automatycznie.',
            'Treść ogólna - słownik aktywny tylko jeśli pojawi się termin militarny.': 'Terminologia branżowa zostanie użyta tylko wtedy, gdy jest potrzebna.',
            'Słownik: ${gi.termsCount} terminów': 'Baza terminologiczna: ${gi.termsCount} terminów',
            '+ ${gi.keepAsIsCount} akronimów zachowanych dosłownie': '+ ${gi.keepAsIsCount} oznaczeń zachowywanych bez zmian',
            "const original = 'Wstaw przykład ↧';": "const original = 'Wstaw przykład';",
            'Przykład ${next + 1}/${arr.length} - kliknij dla kolejnego ↻': 'Przykład ${next + 1}/${arr.length} · pokaż kolejny',
            '<b>Wymaga weryfikacji człowieka:</b>': '<b>Wymaga dodatkowej weryfikacji:</b>',
            'To tłumaczenie traktuj jako wstępne - przed publikacją sprawdź je z osobą znającą rynek/prawo.': 'Przed publikacją sprawdź wynik z osobą znającą rynek lub lokalne regulacje.',
            'Słownik branżowy: <b>': 'Uwzględniona terminologia: <b>',
            'Zachowano bez tłumaczenia (akronimy/standardy): <b>': 'Zachowano bez zmian: <b>',
            'typ: <b>': 'treść: <b>',
            'słownik: <b>': 'terminologia: <b>',
            'akronimy zachowane: <b>': 'oznaczenia zachowane: <b>',
            'flaga: <b>wymaga weryfikacji</b>': 'status: <b>wymaga weryfikacji</b>',
            'mieści się w limicie UI (cel ${b.target} znaków)': 'mieści się w zalecanym limicie interfejsu (${b.target} znaków)',
            'długie dla UI - może obciąć się w przycisku (cel ${b.target}, max ${b.hardMax})': 'tekst jest dłuższy niż zalecany dla interfejsu (cel ${b.target}, maksimum ${b.hardMax})',
            'za długie dla UI - rozwali layout (limit ${b.hardMax})': 'tekst przekracza bezpieczny limit dla elementu interfejsu (${b.hardMax})',
            'Werdykt sędziego:': 'Wynik oceny:',
            'tłumaczenie kontekstowe lepsze': 'wersja kontekstowa oceniona wyżej',
            'zwykły tłumacz lepszy': 'wersja bez dodatkowego kontekstu oceniona wyżej',
            'Zwykły tłumacz': 'Bez kontekstu',
            'Sędzia niedostępny:': 'Ocena niedostępna:',
            '<b>Test podwójnego tłumaczenia</b> (PL → język → PL, dla języków których nikt w firmie nie zweryfikuje gołym okiem):': '<b>Test tłumaczenia zwrotnego</b> (PL → język docelowy → PL; dodatkowa kontrola dla języków trudnych do zweryfikowania wewnętrznie):',
            'Tekst po powrocie do PL:': 'Wersja po tłumaczeniu zwrotnym:',
            '<b>Limit prototypu:</b>': '<b>Limit wersji demonstracyjnej:</b>',
            'W produkcji byłaby kolejka zadań bez limitu.': 'W wersji produkcyjnej ten proces można przenieść do kolejki zadań.',
            'Limit prototypu:': 'Limit wersji demonstracyjnej:',
          }
          for old,new in replacements.items():
              s = s.replace(old,new)
          p.write_text(s)
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/oneoff-ui-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js .github/workflows/oneoff-ui-copy.yml
          git commit -m "Refine translator UI language"
          git push origin HEAD:redesign/modern-ui-2026-08-23
